services:
  ros2:
    build:
      context: .
      args:
        USERNAME: ${HOST_USER}
        USER_UID: ${HOST_UID}
        USER_GID: ${HOST_GID}

    container_name: ros2-lyrical

    network_mode: host

    # Camera frames and DDS buffers share this memory area.
    shm_size: "256m"

    environment:
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      TERM: xterm-256color

    devices:
      - /dev/dri:/dev/dri
      - /dev/ttyACM0:/dev/ttyACM0

    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
      - "${SERIAL_GID}"

    volumes:
      - ${HOME}/ros2_ws/src:/home/${HOST_USER}/ros2_ws/src
      - ${HOME}/ros2_ws/Dev-Doc:/home/${HOST_USER}/ros2_ws/Dev-Doc
      - ${HOME}/Dev/projects/Road-to-SAUVC-2027:/home/${HOST_USER}/Dev/projects/Road-to-SAUVC-2027
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    stdin_open: true
    tty: true

    command: sleep infinity
